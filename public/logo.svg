<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" width="240" height="48" role="img" aria-labelledby="tm-logo-title">
  <title id="tm-logo-title">Task Manager</title>
  <style>
    .tm-word { fill: #0f172a; }
    .tm-accent { fill: #0284c7; }
    @media (prefers-color-scheme: dark) {
      .tm-word { fill: #f8fafc; }
      .tm-accent { fill: #38bdf8; }
    }
  </style>
  <defs>
    <linearGradient id="tm-logo-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <g transform="translate(4 4) scale(1.25)">
    <rect x="1" y="1" width="30" height="30" rx="8" fill="url(#tm-logo-bg)"/>
    <rect x="6.5" y="7" width="5" height="18" rx="2" fill="#fff" fill-opacity=".95"/>
    <rect x="13.5" y="7" width="5" height="12" rx="2" fill="#fff" fill-opacity=".6"/>
    <path d="M20.25 14.75l2.4 2.4 4.1-4.75" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="56" y="32" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" letter-spacing="-0.5"><tspan class="tm-word">Task</tspan><tspan class="tm-accent" dx="6">Manager</tspan></text>
</svg>
